name: testes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # publicar o Allure Report na branch gh-pages

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Executar testes (API + Frontend)
        id: testes
        continue-on-error: true
        run: behave -f html -o reports/report.html

      # ---------------- Allure Report ----------------
      - uses: actions/setup-java@v4
        if: always()
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Allure CLI
        if: always()
        run: |
          curl -sSL -o allure.tgz \
            "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          tar -xzf allure.tgz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"
        env:
          ALLURE_VERSION: "2.30.0"

      - name: Baixar histórico do Allure (gh-pages)
        if: always()
        uses: actions/checkout@v4
        continue-on-error: true   # na primeira execução a branch ainda não existe
        with:
          ref: gh-pages
          path: gh-pages

      - name: Gerar Allure Report
        if: always()
        run: |
          if [ -d gh-pages/history ]; then
            cp -r gh-pages/history reports/allure-results/history
          fi
          cat > reports/allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildName": "Execução #${{ github.run_number }}",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          }
          EOF
          allure generate reports/allure-results -o reports/allure-report --clean

      - name: Publicar Allure Report no GitHub Pages
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: reports/allure-report

      - name: Publicar relatórios como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: reports/

      - name: Falhar o job se algum teste falhou
        if: steps.testes.outcome != 'success'
        run: exit 1
