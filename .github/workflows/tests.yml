name: testes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

env:
  URL_RELATORIO: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

jobs:
  behave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Executar testes (API + Frontend)
        id: testes
        continue-on-error: true
        run: behave -f html -o reports/report.html
        env:
          RECORD_VIDEO: "true"   # vídeo de cada cenário de front-end anexado ao Allure

      # ---------------- Allure Report ----------------
      - uses: actions/setup-java@v4
        if: always()
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Allure CLI
        if: always()
        run: |
          curl -sSL -o allure.tgz \
            "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          tar -xzf allure.tgz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"
        env:
          ALLURE_VERSION: "2.42.0"

      - name: Baixar histórico do relatório publicado
        if: always()
        continue-on-error: true   # na primeira publicação ainda não existe histórico
        run: |
          mkdir -p reports/allure-results/history
          for arquivo in history.json history-trend.json duration-trend.json categories-trend.json retry-trend.json; do
            curl -sSfL -o "reports/allure-results/history/$arquivo" "${URL_RELATORIO}history/$arquivo" || true
          done

      - name: Gerar Allure Report
        if: always()
        run: |
          cat > reports/allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildName": "Execução #${{ github.run_number }}",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "${URL_RELATORIO}"
          }
          EOF
          allure generate reports/allure-results -o reports/allure-report --clean \
            --lang br --name "Accenture QA Report"
          python -m desafio_qa.support.allure_branding reports/allure-report

      - name: Preparar publicação no GitHub Pages
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/allure-report

      - name: Publicar relatórios como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: reports/

      - name: Falhar o job se algum teste falhou
        if: steps.testes.outcome != 'success'
        run: exit 1

  # Publica o Allure Report direto no GitHub Pages (sem branch gh-pages), mesmo se algum teste falhar
  publicar-relatorio:
    needs: behave
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.behave.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: publicacao
        uses: actions/deploy-pages@v4
