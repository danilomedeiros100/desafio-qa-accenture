[behave]
lang = pt
paths = features
# A execução é impressa no terminal pelos hooks (features/environment.py).
# O formatter padrão grava os resultados do Allure em reports/allure-results.
format = allure
default_format = null
outfiles = reports/allure-results
# Sem captura: as ações aparecem no terminal em tempo real.
# (o reporter JUnit força a captura, por isso fica desligado por padrão; use --junit se precisar)
capture = false
capture_hooks = false
summary = false
show_timings = true

[behave.formatters]
allure = allure_behave.formatter:AllureFormatter
html = behave_html_formatter:HTMLFormatter

[behave.userdata]
# Não gera resultados no Allure para cenários excluídos pelo filtro de tags
AllureFormatter.hide_excluded = true
